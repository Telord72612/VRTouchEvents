name: "VRTouch_Contact_Public"
description: "V3 coalesced touch contact — non-intimate, narrated to everyone nearby"

eventCriteria:
  eventType: "vrtouch_contact"
  schemaConditions:
    - fieldPath: "is_private"
      operator: "equals"
      value: "0"
      caseSensitive: false

response:
  type: "direct_narration"
  content: "{{ event_json.narration }}"

audience: "everyone"

enabled: true
interrupt: false
probability: 1
cooldownSeconds: 0
priority: 1
