name: "VRTouch_Contact_Private"
description: "V3 coalesced touch contact — intimate, narrated to the touched NPC only"

eventCriteria:
  eventType: "vrtouch_contact"
  schemaConditions:
    - fieldPath: "is_private"
      operator: "equals"
      value: "1"
      caseSensitive: false

response:
  type: "direct_narration"
  content: "{{ event_json.narration }}"

audience: "target"

enabled: true
interrupt: false
probability: 1
cooldownSeconds: 0
priority: 1
